<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">Antique Trail dark palette options</title>
  <desc id="desc">Three dark color palette directions that do not use teal or mint.</desc>
  <rect width="1440" height="960" fill="#F8F5ED"/>
  <text x="80" y="90" fill="#17312D" font-family="Georgia, serif" font-size="52">A new dark direction</text>
  <text x="80" y="132" fill="#52655F" font-family="Arial, sans-serif" font-size="22">NO TEAL · NO MINT · THREE DISTINCT MATERIAL WORLDS</text>
  <g font-family="Arial, sans-serif">
    <rect x="80" y="190" width="1280" height="196" rx="24" fill="#121519"/>
    <text x="120" y="246" fill="#F3EEE4" font-family="Georgia, serif" font-size="34">1. Midnight Archive</text>
    <text x="120" y="280" fill="#B7B0A5" font-size="20">Charcoal ink, blue-gray navigation, aged brass. Calm, modern, and the strongest fit.</text>
    <rect x="120" y="308" width="110" height="40" rx="10" fill="#121519" stroke="#53606E"/><rect x="246" y="308" width="110" height="40" rx="10" fill="#1A1F26"/><rect x="372" y="308" width="110" height="40" rx="10" fill="#252B33"/><rect x="498" y="308" width="110" height="40" rx="10" fill="#8795B5"/><rect x="624" y="308" width="110" height="40" rx="10" fill="#B99554"/><rect x="750" y="308" width="110" height="40" rx="10" fill="#B56E5B"/><rect x="876" y="308" width="110" height="40" rx="10" fill="#F3EEE4"/>
    <text x="120" y="374" fill="#B7B0A5" font-size="16">ink #121519 · recess #1A1F26 · card #252B33 · action #8795B5 · brass #B99554 · clay #B56E5B · text #F3EEE4</text>
    <rect x="80" y="418" width="1280" height="196" rx="24" fill="#171310"/>
    <text x="120" y="474" fill="#F5EDE1" font-family="Georgia, serif" font-size="34">2. Walnut Cabinet</text>
    <text x="120" y="508" fill="#C1B2A2" font-size="20">Deep walnut and soft porcelain. Brass becomes the only warmth; most understated option.</text>
    <rect x="120" y="536" width="110" height="40" rx="10" fill="#171310" stroke="#645548"/><rect x="246" y="536" width="110" height="40" rx="10" fill="#211B16"/><rect x="372" y="536" width="110" height="40" rx="10" fill="#2C241D"/><rect x="498" y="536" width="110" height="40" rx="10" fill="#CBBCA8"/><rect x="624" y="536" width="110" height="40" rx="10" fill="#A67C3D"/><rect x="750" y="536" width="110" height="40" rx="10" fill="#B56C59"/><rect x="876" y="536" width="110" height="40" rx="10" fill="#F5EDE1"/>
    <text x="120" y="602" fill="#C1B2A2" font-size="16">walnut #171310 · recess #211B16 · cabinet #2C241D · action #CBBCA8 · brass #A67C3D · clay #B56C59 · text #F5EDE1</text>
    <rect x="80" y="646" width="1280" height="196" rx="24" fill="#17141C"/>
    <text x="120" y="702" fill="#F5EFF0" font-family="Georgia, serif" font-size="34">3. Plum Ledger</text>
    <text x="120" y="736" fill="#C1B6C0" font-size="20">An inked-plum reading room with a muted lavender action. Most editorial and distinctive.</text>
    <rect x="120" y="764" width="110" height="40" rx="10" fill="#17141C" stroke="#5A5265"/><rect x="246" y="764" width="110" height="40" rx="10" fill="#211D29"/><rect x="372" y="764" width="110" height="40" rx="10" fill="#2D2636"/><rect x="498" y="764" width="110" height="40" rx="10" fill="#9A88AE"/><rect x="624" y="764" width="110" height="40" rx="10" fill="#B69254"/><rect x="750" y="764" width="110" height="40" rx="10" fill="#BD7180"/><rect x="876" y="764" width="110" height="40" rx="10" fill="#F5EFF0"/>
    <text x="120" y="830" fill="#C1B6C0" font-size="16">plum ink #17141C · recess #211D29 · card #2D2636 · action #9A88AE · brass #B69254 · clay #BD7180 · text #F5EFF0</text>
  </g>
  <text x="80" y="910" fill="#52655F" font-family="Arial, sans-serif" font-size="18">All three keep brass for freshness/warnings and clay for destructive states; they differ only in the dark-mode material world and primary-action accent.</text>
</svg>
