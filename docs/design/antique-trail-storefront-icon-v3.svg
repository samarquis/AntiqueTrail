<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Antique Trail storefront app icon concept</title>
  <desc id="desc">A simplified antique shop with a bold keyed cornice, signature three-scallop awning, and arched doorway.</desc>
  <!-- Concept artwork only. This does not replace public/app-icon.svg. -->
  <rect width="512" height="512" rx="104" fill="#202833"/>

  <!-- Oversized keyed ends remain intentional at 24px and give the roofline its own cadence. -->
  <path fill="#F3EEE4" d="M96 100h320v48h-32v24H128v-24H96z"/>

  <!-- The center scallop is 25% deeper and shares the doorway's centerline. -->
  <path fill="#7F9DB5" d="M124 154h264l20 58v6c0 26-21 40-48 40s-48-14-48-40c0 31-25 50-56 50s-56-19-56-50c0 26-21 40-48 40s-48-14-48-40v-6l20-58Z"/>

  <!-- The field-color gap preserves the awning in one ink; a top beam keeps this a shop, not an archway. -->
  <path fill="#F3EEE4" fill-rule="evenodd" d="M128 286h256v138H128V286Zm82 138v-66a46 46 0 0 1 92 0v66h-92Z"/>
</svg>

