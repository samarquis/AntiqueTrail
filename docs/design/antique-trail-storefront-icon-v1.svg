<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Antique Trail storefront app icon concept</title>
  <desc id="desc">A simplified antique shop with a broad three-scallop awning and one arched doorway.</desc>
  <!-- Concept artwork only. This does not replace public/app-icon.svg. -->
  <rect width="512" height="512" rx="104" fill="#202833"/>

  <!-- Quiet cornice: enough architecture to read as a permanent local shop. -->
  <path fill="#F3EEE4" d="M128 104h256c13 0 24 11 24 24s-11 24-24 24H128c-13 0-24-11-24-24s11-24 24-24Z"/>

  <!-- Facade with one generous arched doorway cut from the center. -->
  <path fill="#F3EEE4" fill-rule="evenodd" d="M128 204h256v220H128V204Zm82 220V312a46 46 0 0 1 92 0v112h-92Z"/>

  <!-- Signature canopy: three deep scallops, with the center aligned to the doorway. -->
  <path fill="#7F9DB5" d="M124 152h264l20 62v4c0 26-21 47-48 47s-48-21-48-47c0 26-25 47-56 47s-56-21-56-47c0 26-21 47-48 47s-48-21-48-47v-4l20-62Z"/>

  <!-- One restrained point of warmth; it disappears harmlessly in one ink. -->
  <circle cx="279" cy="359" r="9" fill="#B98B45"/>
</svg>

