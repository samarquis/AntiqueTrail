<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Antique Trail AT monogram, monochrome candidate V6</title>
  <desc id="desc">A geometric A and T where the T passes over one broken A diagonal while both letterforms remain independently clear.</desc>
  <!-- Exploratory artwork only. This file does not replace the production app icon. -->
  <rect width="512" height="512" rx="104" fill="#202833"/>
  <!-- A: broad, familiar silhouette. The short break is the single underpass. -->
  <g fill="none" stroke="#F4EFE6" stroke-width="44" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M84 406 222 92 248 151"/>
    <path d="M283 230 394 406"/>
    <path d="M144 306H316"/>
  </g>
  <!-- T: deliberately right-sided so its letterform remains complete in one ink. -->
  <g fill="none" stroke="#F4EFE6" stroke-width="44" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M246 172H432"/>
    <path d="M350 172V284"/>
  </g>
</svg>
