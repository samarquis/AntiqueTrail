<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Antique Trail AT monogram, monochrome candidate V5</title>
  <desc id="desc">A one-ink geometric A and T with one explicit over-under crossing on the A's right diagonal.</desc>
  <!-- Exploratory artwork only. This file does not replace the production app icon. -->
  <rect width="512" height="512" rx="104" fill="#202833"/>
  <!-- A. The deliberately open section on the right diagonal is the rear half of the weave. -->
  <g fill="none" stroke="#F4EFE6" stroke-width="46" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M90 404 230 94 250 138"/>
    <path d="M292 230 392 404"/>
    <path d="M150 290H330"/>
  </g>
  <!-- T. Its cap crosses one A diagonal only; its full exposed stem stops before the A crossbar. -->
  <g fill="none" stroke="#F4EFE6" stroke-width="46" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M252 172H400"/>
    <path d="M326 172V258"/>
  </g>
</svg>
