name: Plan-governed implementation ticket
description: Define one repository outcome that an agent can finish and close.
title: ''
body:
  - type: markdown
    attributes:
      value: |
        Keep this small: one outcome, at most five acceptance criteria, and no external activation gate. If intended behavior changes, first obtain `update plan` and merge the amendment.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Give current-main evidence and the user or operational harm.
      placeholder: Baseline SHA, reproduction or code seam, observed result, and why it matters.
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: Plan
      description: Cite the controlling Markdown file and exact heading. Add dependencies or non-goals only when needed.
      placeholder: "PRD.md — Store Browser requirements. Depends on #123. Does not activate production."
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: State one independently closable repository result.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: Add one to five observable checkboxes. Put human, provider, legal, payment, research, or activation evidence in a separate gate issue.
      placeholder: '- [ ] Observable result tied to the cited plan.'
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Name only the executable checks needed to prove the acceptance criteria.
    validations:
      required: true
