name: Build H-01 Pages release artifact

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: antique-trail-pages-release-artifact
  cancel-in-progress: false

jobs:
  build-once:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check, test, and build once
        run: npm run check
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run browser acceptance tests
        run: npm run test:e2e
      - name: Create deterministic exact-dist bundle
        id: bundle
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          checked_out_sha="$(git rev-parse HEAD)"
          node_version="$(node --version)"
          npm_version="$(npm --version)"
          node scripts/release-artifact.mjs create \
            --dist dist \
            --out release-bundle \
            --source-sha "$checked_out_sha" \
            --repository "$REPOSITORY" \
            --node-version "$node_version" \
            --npm-version "$npm_version" \
            --runner-os "$RUNNER_OS" \
            --runner-arch "$RUNNER_ARCH" \
            --lockfile package-lock.json \
            > release-manifest-output.json
          digest="$(jq -r '.artifactDigest' release-bundle/artifact-manifest.json)"
          test "$(printf '%s' "$digest" | wc -c)" -eq 64
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "source_sha=$checked_out_sha" >> "$GITHUB_OUTPUT"
      - name: Upload immutable rollback-capable bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: antique-trail-pages
          path: release-bundle/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Record artifact coordinates
        env:
          DIGEST: ${{ steps.bundle.outputs.digest }}
          SOURCE_SHA: ${{ steps.bundle.outputs.source_sha }}
        run: |
          {
            echo '## H-01 Pages release artifact'
            echo
            echo "- Source SHA: \`$SOURCE_SHA\`"
            echo "- Artifact SHA-256: \`$DIGEST\`"
            echo "- Source workflow run: \`$GITHUB_RUN_ID\`"
            echo '- Artifact name: `antique-trail-pages`'
            echo '- Deployment: not performed; use the protected manual deployment workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
