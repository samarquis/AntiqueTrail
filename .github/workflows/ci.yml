name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: antique-trail-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Repository security contract
        run: npm run security:contract
      - name: Dependency vulnerability review
        run: npm run security:audit
      - name: Generate CycloneDX SBOM
        run: mkdir -p artifacts && npm sbom --sbom-format cyclonedx > artifacts/sbom.cdx.json
      - name: Static checks, unit tests, and production build
        run: npm run check
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cyclonedx-sbom
          path: artifacts/sbom.cdx.json
          if-no-files-found: error

  database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Start local Supabase
        run: npx supabase@2.33.9 start
      - name: Reset local Supabase
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          npx supabase@2.33.9 db reset --local 2>&1 | tee artifacts/supabase-reset.log
      - name: Grant ephemeral database test roles
        shell: bash
        run: |
          docker exec -e PGPASSWORD=postgres supabase_db_antique-trail \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          grant account_lifecycle_service, candidate_cleanup_service,
            community_deployment_service, community_evidence_service,
            identity_service, public_catalog_gateway,
            readiness_calculation_service, readiness_signature_service,
            release_executor, rg01_calculation_service
          to postgres;
          SQL
      - name: Run pgTAP database contracts
        shell: bash
        run: |
          set -o pipefail
          npx supabase@2.33.9 test db 2>&1 | tee artifacts/supabase-pgtap.log
      - name: Upload database failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: database-failure-logs
          path: artifacts/supabase-*.log
          if-no-files-found: error
