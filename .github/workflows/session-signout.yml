name: Configured session sign-out

on:
  pull_request:
    paths:
      - 'src/features/auth/**'
      - 'src/app/configuredComposition*'
      - 'e2e/configured-free-shopper*'
      - 'scripts/configured-free-shopper*'
      - 'scripts/configured-shopper-*'
      - '.github/workflows/session-signout.yml'

permissions:
  contents: read

concurrency:
  group: session-signout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  session-signout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Real disposable session acceptance
        run: npm run test:e2e:configured-shopper -- --session-signout
      - name: Prepare allowlisted receipt
        if: always()
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          const roots = fs.existsSync('artifacts') ? fs.readdirSync('artifacts') : []
          const reports = roots.filter(name => name.startsWith('configured-shopper-'))
            .map(name => `artifacts/${name}/report.json`).filter(file => fs.existsSync(file))
          if (reports.length !== 1) throw new Error('Expected one configured report')
          const report = JSON.parse(fs.readFileSync(reports[0], 'utf8'))
          // Never publish raw errors, browser traces, tokens, or login material.
          const receipt = { environment: 'github-actions-disposable',
            sourceSha: report.sourceSha, sourceDirty: report.sourceDirty,
            scope: report.scope, status: report.status, cleanup: report.cleanup,
            stats: report.stats && { expected: report.stats.expected,
              unexpected: report.stats.unexpected, skipped: report.stats.skipped,
              flaky: report.stats.flaky },
            checks: report.checks?.map(({ name, project, status }) => ({ name, project, status })) }
          fs.writeFileSync('artifacts/session-signout-receipt.json', JSON.stringify(receipt, null, 2))
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '```json\n' + JSON.stringify(receipt, null, 2) + '\n```\n')
          JS
      - name: Upload allowlisted receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: session-signout-receipt
          path: artifacts/session-signout-receipt.json
          if-no-files-found: error
