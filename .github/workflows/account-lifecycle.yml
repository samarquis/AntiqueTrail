name: Run account and review lifecycle cleanup

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: antique-trail-account-lifecycle
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WORKER_URL: ${{ vars.ACCOUNT_LIFECYCLE_WORKER_URL }}
      SCHEDULER_TOKEN: ${{ secrets.ACCOUNT_LIFECYCLE_SCHEDULER_TOKEN }}
    steps:
      - name: Keep unconfigured lifecycle safely disabled
        if: ${{ env.WORKER_URL == '' || env.SCHEDULER_TOKEN == '' }}
        run: |
          echo 'Account lifecycle schedule is not configured; no provider call was made.'
          echo 'Configure the constrained worker URL and scheduler token before shared use.' >> "$GITHUB_STEP_SUMMARY"

      - name: Run bounded account and review lifecycle sweep
        if: ${{ env.WORKER_URL != '' && env.SCHEDULER_TOKEN != '' }}
        shell: bash
        run: |
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --connect-timeout 5 --max-time 60 --retry 1 --retry-all-errors \
            --request POST \
            --header "x-antique-trail-scheduler: ${SCHEDULER_TOKEN}" \
            --header 'content-type: application/json' \
            --data '{}' \
            "$WORKER_URL")"
          if [[ ! "$status" =~ ^2 ]]; then
            echo "Lifecycle worker returned HTTP ${status}." >&2
            exit 1
          fi
          echo 'Bounded lifecycle sweep completed.' >> "$GITHUB_STEP_SUMMARY"
