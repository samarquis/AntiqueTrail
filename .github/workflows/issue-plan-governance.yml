name: Issue plan governance

on:
  issues:
    types: [opened, edited, reopened, labeled]

permissions:
  contents: read
  issues: write

jobs:
  issue-plan-contract:
    if: github.event.action != 'labeled' || github.event.label.name != 'plan-invalid'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout governance contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate ticket against the plan
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const { pathToFileURL } = require("node:url");
            const contractUrl = pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/scripts/plan-governance-contract.mjs`,
            ).href;
            const { validatePlanTicket } = await import(contractUrl);
            const result = validatePlanTicket(context.payload.issue.body || "");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;
            const marker = "<!-- antique-trail-plan-governance -->";
            const readyLabels = ["ready-for-agent", "task"];
            const labels = context.payload.issue.labels.map((label) => label.name);

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 },
            );
            const existing = comments.find((comment) =>
              comment.body?.includes(marker),
            );

            if (!result.valid) {
              try {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: "plan-invalid",
                  color: "B60205",
                  description: "Ticket does not satisfy PLAN_GOVERNANCE.md",
                });
              } catch (error) {
                if (error.status !== 422) throw error;
              }

              for (const label of readyLabels.filter((name) => labels.includes(name))) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: label });
              }
              if (!labels.includes("plan-invalid")) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number,
                  labels: ["plan-invalid"],
                });
              }

              const body = `${marker}\nThis ticket is not implementation-ready under \`PLAN_GOVERNANCE.md\`:\n\n${result.errors.map((error) => `- ${error}`).join("\n")}\n\nEdit the ticket to restore the required problem-to-plan-to-outcome-to-evidence trace.`;
              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
              core.setFailed(result.errors.join("\n"));
              return;
            }

            if (labels.includes("plan-invalid")) {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number,
                name: "plan-invalid",
              });
            }
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: `${marker}\nPlan-governance ticket contract passed. Readiness still requires a current-main human or agent review.`,
              });
            }
