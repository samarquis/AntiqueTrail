name: Issue 579 Owner listing proof

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  push:
    branches:
      - codex/issue-579-owner-listing
  workflow_dispatch:
    inputs:
      phase:
        description: Configured Owner acceptance phase
        required: true
        type: choice
        options:
          - first
          - invited-lifecycle
          - owner-identity
          - portal-drafts
          - managed-hours
          - controlled-change
          - full

permissions:
  contents: read

jobs:
  owner-listing:
    name: Owner listing on ephemeral local service
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.number == 627 &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.ref == 'codex/issue-579-main-integration')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      OWNER_LISTING_PHASE: ${{ github.event_name == 'pull_request' && 'owner-identity' || github.event_name == 'workflow_dispatch' && inputs.phase || contains(github.event.head_commit.message, '[owner-phase:invited-lifecycle]') && 'invited-lifecycle' || contains(github.event.head_commit.message, '[owner-phase:owner-identity]') && 'owner-identity' || contains(github.event.head_commit.message, '[owner-phase:portal-drafts]') && 'portal-drafts' || contains(github.event.head_commit.message, '[owner-phase:managed-hours]') && 'managed-hours' || contains(github.event.head_commit.message, '[owner-phase:controlled-change]') && 'controlled-change' || contains(github.event.head_commit.message, '[owner-first-phase]') && 'first' || 'full' }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify exact candidate SHA and phase
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            test "$OWNER_LISTING_PHASE" = owner-identity
          fi

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run selected configured Owner listing phase
        run: |
          if [ "$OWNER_LISTING_PHASE" = first ]; then
            node scripts/configured-representative-hours.mjs --owner-listing-first-phase
          elif [ "$OWNER_LISTING_PHASE" = full ]; then
            node scripts/configured-representative-hours.mjs --owner-listing
          else
            node scripts/configured-representative-hours.mjs "--owner-listing-phase=$OWNER_LISTING_PHASE"
          fi

      - name: Upload sanitized Owner listing evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-579-owner-listing-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .codex/issue-579/runs/*/report.json
            .codex/issue-579/runs/*/browser/**/public-*.png
          if-no-files-found: warn
