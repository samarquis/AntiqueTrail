name: Issue 579 Owner listing proof

on:
  push:
    branches:
      - codex/issue-579-owner-listing

permissions:
  contents: read

jobs:
  owner-listing:
    name: Owner listing on ephemeral local service
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify exact candidate SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run configured Owner listing proof
        run: node scripts/configured-representative-hours.mjs --owner-listing

      - name: Upload sanitized Owner listing evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-579-owner-listing-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .codex/issue-579/runs/*/report.json
            .codex/issue-579/runs/*/browser/**/public-*.png
          if-no-files-found: warn
