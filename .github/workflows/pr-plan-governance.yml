name: Plan governance

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  plan-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout governance contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Validate ticket and plan traceability
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const { pathToFileURL } = require("node:url");
            const contractUrl = pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/scripts/plan-governance-contract.mjs`,
            ).href;
            const { validatePlanPullRequest } = await import(contractUrl);
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const changelog = files.find(
              (file) => file.filename === "PLAN_CHANGELOG.md",
            );
            if (changelog) {
              const readContent = async (ref) => {
                try {
                  const response = await github.rest.repos.getContent({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    path: "PLAN_CHANGELOG.md",
                    ref,
                  });
                  return Buffer.from(response.data.content, "base64").toString("utf8");
                } catch (error) {
                  if (error.status === 404) return "";
                  throw error;
                }
              };
              changelog.beforeContent = await readContent(
                context.payload.pull_request.base.sha,
              );
              changelog.afterContent = await readContent(
                context.payload.pull_request.head.sha,
              );
            }
            const result = validatePlanPullRequest(
              context.payload.pull_request.body || "",
              files,
            );

            if (!result.valid) {
              core.setFailed(result.errors.join("\n"));
              return;
            }

            core.info(
              result.protectedFiles.length > 0
                ? `Authorized plan amendment: ${result.protectedFiles.join(", ")}`
                : "Conforming change; no protected plan amendment detected.",
            );
