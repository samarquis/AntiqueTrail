name: Configured seed media

on:
  pull_request:
    paths:
      - '.github/workflows/seed-media.yml'
      - 'supabase/seed.sql'
      - 'supabase/migrations/**'
      - 'public/images/synthetic-stores/**'
      - 'scripts/configured-free-shopper*'
      - 'scripts/configured-shopper*'
      - 'scripts/verify-seed-media*'
      - 'e2e/configured-free-shopper*'

permissions:
  contents: read

concurrency:
  group: configured-seed-media-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configured-seed-media:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Verify configured desktop and phone media
        run: node scripts/configured-free-shopper.mjs --media-only
      - name: Prepare allowlisted result summary
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import path from 'node:path'
          const runs = fs.readdirSync('artifacts').filter(name => name.startsWith('configured-shopper-'))
          if (runs.length !== 1) throw new Error('Expected one configured browser receipt')
          const report = JSON.parse(fs.readFileSync(path.join('artifacts', runs[0], 'report.json'), 'utf8'))
          const summary = {
            sourceSha: report.sourceSha,
            sourceDirty: report.sourceDirty,
            scope: report.scope,
            status: report.status,
            cleanup: report.cleanup,
            stats: report.stats && Object.fromEntries(
              ['expected', 'unexpected', 'skipped', 'flaky'].map(key => [key, report.stats[key]])
            ),
            checks: (report.checks ?? []).map(({ name, project, status }) => ({ name, project, status })),
          }
          fs.writeFileSync('artifacts/configured-seed-media-summary.json', JSON.stringify(summary, null, 2))
          NODE
      - name: Upload scoped result summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: configured-seed-media
          path: artifacts/configured-seed-media-summary.json
          if-no-files-found: error
